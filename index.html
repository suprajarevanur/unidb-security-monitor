<!DOCTYPE html><html><head><title>UniDB Monitor</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080c10;color:#c8d8e8;font-family:monospace}.header{background:#0d1117;padding:20px;border-bottom:1px solid #1a2535;display:flex;justify-content:space-between}.header h1{color:#00ff88;font-size:18px}.live{color:#00ff88}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:24px}.stat{background:#0d1117;border:1px solid #1a2535;padding:20px;text-align:center}.stat-label{font-size:10px;color:#5a7a9a;margin-bottom:10px}.stat-value{font-size:40px;font-weight:bold}.g{color:#00ff88}.r{color:#ff3b5c}.a{color:#ffaa00}.b{color:#3b9eff}.section{padding:0 24px 24px}.stitle{color:#fff;padding:12px;background:#0d1117;border-left:3px solid #00ff88;margin-bottom:1px}table{width:100%;border-collapse:collapse;background:#0d1117}th{padding:10px;text-align:left;font-size:9px;color:#5a7a9a;border-bottom:1px solid #1a2535}td{padding:10px;font-size:12px;border-bottom:1px solid #0f1a2a}.C{color:#ff3b5c}.W{color:#ffaa00}.I{color:#3b9eff}.ip{color:#3b9eff}.tm{color:#5a7a9a}</style></head>
<body><div class="header"><h1>UniDB Security Monitor</h1><div class="live">LIVE</div></div><div class="stats"><div class="stat"><div class="stat-label">TOTAL EVENTS</div><div class="stat-value g" id="t">-</div></div><div class="stat"><div class="stat-label">CRITICAL</div><div class="stat-value r" id="c">-</div></div><div class="stat"><div class="stat-label">WARNINGS</div><div class="stat-value a" id="w">-</div></div><div class="stat"><div class="stat-label">ATTACKER IPs</div><div class="stat-value b" id="i">-</div></div></div>
<div class="section"><div class="stitle">LIVE EVENT FEED</div><table><thead><tr><th>TIME</th><th>SOURCE IP</th><th>DEST IP</th><th>SEVERITY</th><th>MESSAGE</th></tr></thead><tbody id="ev"></tbody></table></div>
<script>async function go(){try{const s=await fetch("/api/stats").then(r=>r.json());document.getElementById("t").textContent=s.total;document.getElementById("c").textContent=s.critical;document.getElementById("w").textContent=s.warning;document.getElementById("i").textContent=s.unique_ips;const e=await fetch("/api/events").then(r=>r.json());document.getElementById("ev").innerHTML=e.length?e.map(v=>"<tr><td class=tm>"+v.timestamp.slice(11,19)+"</td><td class=ip>"+v.source_ip+"</td><td class=ip>"+v.dest_ip+"</td><td class="+v.severity[0]+">"+v.severity+"</td><td>"+v.message+"</td></tr>").join(""):"<tr><td colspan=5 style=color:#5a7a9a;text-align:center;padding:20px>No events yet</td></tr>";}catch(e){console.log(e);}}go();setInterval(go,5000);</script></body></html>
